project:
  type: book
  output-dir: _book

book:
  title: "Governed Agent Trust Environment"
  subtitle: "A Cloud Reference Framework of Controls for Enterprise-Grade Trustworthy AI Agents"
  author: "Andrew Stevens"
  output-file: "GATE-v1.4"
  date: "2026"
  chapters:
    - index.qmd
    - chapters/01-changelog.qmd
    - chapters/02-executive-summary.qmd
    - chapters/03-scope-and-non-goals.qmd
    - chapters/04-design-principles.qmd
    - chapters/05-threat-model.qmd
    - chapters/06-reference-architecture.qmd
    - chapters/07-controls-at-a-glance.qmd
    - chapters/08-implementation-guidance.qmd
    - chapters/09-control-plane-contracts.qmd
    - chapters/10-reference-repository.qmd
    - chapters/11-control-catalog-layer-1.qmd
    - chapters/12-control-catalog-layer-2.qmd
    - chapters/13-control-catalog-layer-3.qmd
    - chapters/14-control-catalog-layer-4.qmd
    - chapters/15-operationalization.qmd
    - chapters/16-conformance.qmd
  appendices:
    - chapters/A1-evidence-pack-index.qmd
    - chapters/A2-standard-mappings.qmd
    - chapters/A3-artifacts.qmd
    - chapters/A4-day2-runbooks.qmd
    - chapters/A5-cloud-quickstart.qmd
    - chapters/A6-glossary.qmd
    - chapters/A7-references.qmd

version: "1.4"

bibliography: references.bib
csl: harvard.csl

crossref:
  chapters: true

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
  pdf:
    output-file: "GATE-v1.4"
    documentclass: scrreprt
    classoption:
      - oneside
      - open=any
    papersize: letter
    fontsize: 11pt
    geometry:
      - top=1in
      - bottom=1in
      - left=1.25in
      - right=1.25in
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    fig-pos: "H"
    keep-tex: false

mermaid:
  theme: default
